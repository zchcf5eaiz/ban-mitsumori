<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>盤見積もりアプリ — LG表示</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #fff; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    .display-toolbar { height: 36px; flex: 0 0 36px; display: flex; justify-content: flex-end; align-items: center; padding: 0 10px; }
    #display-toggle { font: 12px -apple-system, BlinkMacSystemFont, sans-serif; color: #526379; background: #fff; border: 1px solid #d5dce5; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
    #display-toggle:hover { background: #f4f7fa; }
    #display-toggle:focus-visible { outline: 2px solid #3182ce; outline-offset: 2px; }
    #display-space { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #display-stage { position: relative; flex: none; }
    #estimate-app { position: absolute; top: 0; left: 0; width: 2560px; height: 1080px; border: 0; transform-origin: top left; background: #fff; }
  </style>
</head>
<body>
  <div class="display-toolbar">
    <button id="display-toggle" type="button" aria-pressed="true" title="LG 34GL750相当の表示と通常表示を切り替えます。入力中の内容は保持されます。">LG表示中 · 通常表示に戻す</button>
  </div>
  <main id="display-space" aria-label="見積アプリ">
    <div id="display-stage">
    <iframe id="estimate-app" src="index.html?v=20261119o" title="盤見積もりアプリ"></iframe>
    </div>
  </main>
  <script>
    // アプリ自身の表示領域を2560×1080に保つことで、メディアクエリ、
    // sticky、vh、ダイアログもLG画面と同じ寸法でレイアウトする。
    // 表示切り替えではiframeを再読み込みせず、入力中の状態を保持する。
    const space = document.getElementById('display-space');
    const stage = document.getElementById('display-stage');
    const frame = document.getElementById('estimate-app');
    const toggle = document.getElementById('display-toggle');
    let lgDisplay = true;

    function fitDisplay() {
      const availableWidth = space.clientWidth;
      const availableHeight = space.clientHeight;
      const width = lgDisplay ? 2560 : availableWidth;
      const height = lgDisplay ? 1080 : availableHeight;
      const scale = lgDisplay ? Math.min(1, availableWidth / width, availableHeight / height) : 1;
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      frame.style.transform = `scale(${scale})`;
      stage.style.width = `${width * scale}px`;
      stage.style.height = `${height * scale}px`;
    }

    toggle.addEventListener('click', () => {
      lgDisplay = !lgDisplay;
      toggle.setAttribute('aria-pressed', String(lgDisplay));
      toggle.textContent = lgDisplay ? 'LG表示中 · 通常表示に戻す' : 'LG表示にする';
      document.title = lgDisplay ? '盤見積もりアプリ — LG表示' : '盤見積もりアプリ';
      fitDisplay();
    });
    new ResizeObserver(fitDisplay).observe(space);
    fitDisplay();
  </script>
</body>
</html>
